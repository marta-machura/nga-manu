name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # npm ci installs exactly what's in package-lock.json, so CI matches your machine
      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build
