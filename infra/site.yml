AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Nga Manu static site: a private S3 bucket served through CloudFront, plus an
  IAM role that GitHub Actions assumes via OIDC to deploy (no stored AWS keys).

Parameters:
  GitHubRepo:
    Type: String
    # GitHub's OIDC tokens use immutable IDs (owner@id/repo@id), so a deleted and
    # recreated repo with the same name can't deploy. Find yours with:
    #   gh api repos/OWNER/REPO/actions/oidc/customization/sub
    Default: marta-machura@63081593/nga-manu@1433798649
    Description: owner@id/repo@id allowed to deploy, as it appears in the OIDC sub claim
  CreateGitHubOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: An account can only have one GitHub OIDC provider. Set to false if it already exists.

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, "true"]

Resources:
  # --- Storage: private bucket, only CloudFront can read it ---
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # --- Delivery: HTTPS and caching at edge locations worldwide ---
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Astro builds /manu/123/ as /manu/123/index.html. S3 doesn't resolve folder
  # URLs to index.html on its own, so this rewrites the request at the edge.
  IndexRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-index-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Map folder URLs to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri.endsWith("/")) {
            request.uri += "index.html";
          } else if (!uri.split("/").pop().includes(".")) {
            request.uri += "/index.html";
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Nga Manu
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All # the cheaper classes leave out Australia and New Zealand edge locations
        Origins:
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed "CachingOptimized"
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt IndexRewriteFunction.FunctionMetadata.FunctionARN
        # Without list permission, S3 answers 403 for missing files; show the 404 page instead.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html

  # --- Deployment: GitHub Actions gets short-lived credentials, main branch only ---
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions to deploy Nga Manu
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidc
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepo}:ref:refs/heads/main"
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  SiteUrl:
    Value: !Sub "https://${Distribution.DomainName}"
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
